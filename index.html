<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 攝影機器人取景大腦 (Pose 終極版)</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    
    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    video { display: none; }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .top-bar {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      backdrop-filter: blur(8px);
      cursor: pointer;
    }
    .btn.connected { background: #28a745; border-color: #28a745; }

    .status-card {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 13px;
      letter-spacing: 1px;
      backdrop-filter: blur(5px);
      z-index: 10;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .shutter-btn {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid rgba(0,0,0,0.2);
      box-shadow: 0 0 0 3px #fff;
      z-index: 10;
      cursor: pointer;
    }
    .shutter-btn:active { transform: translateX(-50%) scale(0.92); }
  </style>
</head>
<body>

  <div id="viewport">
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div class="top-bar">
      <button id="bleBtn" class="btn">連接 ESP32 藍牙</button>
      <div id="fpsText" style="font-size: 12px; opacity: 0.7;">FPS: --</div>
    </div>

    <div id="statusIndicator" class="status-card">搜尋人體目標中...</div>
    <button id="shutterBtn" class="shutter-btn"></button>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const bleBtn = document.getElementById('bleBtn');
    const statusIndicator = document.getElementById('statusIndicator');
    const shutterBtn = document.getElementById('shutterBtn');
    const fpsText = document.getElementById('fpsText');

    const NUS_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const NUS_RX_UUID      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    let rxCharacteristic = null;
    let lastSendTime = 0;
    const SEND_INTERVAL_MS = 100;

    bleBtn.addEventListener('click', async () => {
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'AI_Cameraman_ESP32' }, { namePrefix: 'PhotoBot' }],
          optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(NUS_SERVICE_UUID);
        rxCharacteristic = await service.getCharacteristic(NUS_RX_UUID);
        
        bleBtn.textContent = "已連線至小車";
        bleBtn.classList.add("connected");
      } catch (err) {
        alert("藍牙連接失敗: " + err);
      }
    });

    async function sendESP32(cmd) {
      if (!rxCharacteristic) return;
      const now = performance.now();
      if (now - lastSendTime < SEND_INTERVAL_MS) return;
      
      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode(cmd + '\n'));
        lastSendTime = now;
      } catch (e) {
        console.warn("BLE Write Fail:", e);
      }
    }

    function drawGrid(w, h) {
      canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      canvasCtx.lineWidth = 1;

      canvasCtx.beginPath();
      canvasCtx.moveTo(w / 3, 0); canvasCtx.lineTo(w / 3, h);
      canvasCtx.moveTo((w * 2) / 3, 0); canvasCtx.lineTo((w * 2) / 3, h);
      canvasCtx.moveTo(0, h / 3); canvasCtx.lineTo(w, h / 3);
      canvasCtx.moveTo(0, (h * 2) / 3); canvasCtx.lineTo(w, (h * 2) / 3);
      canvasCtx.stroke();
    }

    const POSE_CONNECTIONS = [
      [11, 12], [11, 23], [12, 24], [23, 24],
      [11, 13], [13, 15], [12, 14], [14, 16],
      [23, 25], [25, 27], [24, 26], [26, 28]
    ];

    let frameCount = 0, lastFpsUpdate = 0;

    function onResults(results) {
      frameCount++;
      const now = performance.now();
      if (now - lastFpsUpdate >= 1000) {
        fpsText.textContent = `FPS: ${frameCount}`;
        frameCount = 0;
        lastFpsUpdate = now;
      }

      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;
      const w = canvasElement.width;
      const h = canvasElement.height;

      canvasCtx.save();
      canvasCtx.drawImage(results.image, 0, 0, w, h);
      drawGrid(w, h);

      if (results.poseLandmarks) {
        const lm = results.poseLandmarks;

        const nose = lm[0];
        const leftShoulder = lm[11];
        const rightShoulder = lm[12];
        const leftAnkle = lm[27];
        const rightAnkle = lm[28];

        const shoulderCenterX = (leftShoulder.x + rightShoulder.x) / 2;
        const shoulderCenterY = (leftShoulder.y + rightShoulder.y) / 2;

        const topY = (nose && nose.visibility > 0.5) ? nose.y : shoulderCenterY;
        const bottomY = (leftAnkle.visibility > 0.5 || rightAnkle.visibility > 0.5)
                        ? Math.max(leftAnkle.y, rightAnkle.y)
                        : Math.max(lm[23].y, lm[24].y);
        const bodySpan = bottomY - topY;

        canvasCtx.strokeStyle = '#00E5FF';
        canvasCtx.lineWidth = 2;
        POSE_CONNECTIONS.forEach(([i, j]) => {
          if (lm[i].visibility > 0.4 && lm[j].visibility > 0.4) {
            canvasCtx.beginPath();
            canvasCtx.moveTo(lm[i].x * w, lm[i].y * h);
            canvasCtx.lineTo(lm[j].x * w, lm[j].y * h);
            canvasCtx.stroke();
          }
        });

        canvasCtx.fillStyle = '#FF0055';
        canvasCtx.beginPath();
        canvasCtx.arc(shoulderCenterX * w, shoulderCenterY * h, 6, 0, 2 * Math.PI);
        canvasCtx.fill();

        const TARGET_X = 0.50;
        const TARGET_Y = 0.40;
        const TARGET_SPAN = 0.60;

        const errX = shoulderCenterX - TARGET_X;
        const errY = shoulderCenterY - TARGET_Y;
        const errSpan = bodySpan - TARGET_SPAN;

        let vx = 0, vy = 0, lift = 0;
        let actionText = "骨架鎖定，構圖最佳";

        if (errSpan < -0.15) {
          vx = 22;
          actionText = "靠近主體中...";
        } else if (errSpan > 0.15) {
          vx = -20;
          actionText = "距離過近：後退拉開構圖";
        }

        if (errX > 0.05) {
          vy = 15;
          actionText = "向右平移對齊中軸";
        } else if (errX < -0.05) {
          vy = -15;
          actionText = "向左平移對齊中軸";
        }

        if (topY < 0.12) {
          lift = -1;
        } else if (errY < -0.08) {
          lift = 1;
        }

        sendESP32(`$MOVE,${vx},${vy},0#`);
        if (lift !== 0) sendESP32(`$LIFT,${lift}#`);

        statusIndicator.textContent = actionText;

      } else {
        // 未發現目標時，原地停止發呆，不隨意盲開
        statusIndicator.textContent = "未發現人體，原地待機中";
        sendESP32("$MOVE,0,0,0#");
      }

      canvasCtx.restore();
    }

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 2,
      smoothLandmarks: true,
      minDetectionConfidence: 0.4,
      minTrackingConfidence: 0.4
    });
    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      facingMode: 'environment',
      width: 1920,
      height: 1080
    });
    camera.start();

    shutterBtn.addEventListener('click', () => {
      sendESP32("$SNAP#");
      canvasElement.style.opacity = '0.3';
      setTimeout(() => canvasElement.style.opacity = '1.0', 150);
      
      const link = document.createElement('a');
      link.download = `PoseBot_${Date.now()}.png`;
      link.href = canvasElement.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
